name: IntelliHire CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  client-check:
    name: Client Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Client Dependencies
        run: npm --prefix client install

      - name: Run ESLint
        run: npm --prefix client run lint

      - name: Run TypeScript Check
        run: npm --prefix client run check

      - name: Run Client Vitest Unit Tests
        run: npm --prefix client run test -- --run

  backend-pytest:
    name: FastAPI Backend Pytest
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: "ci-secret-key-for-testing-purposes-only-1234567890"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intellihire"
      NODE_ENV: "test"
      PYTHONPATH: "server_py"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_py/requirements.txt

      - name: Run Pytest Suite
        run: python -m pytest server_py/tests

      - name: Scan Python source with Bandit
        run: bandit -q -r server_py/app -s B101,B104,B105 || true

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        run: npm --prefix client install

      - name: Audit client dependencies
        run: npm --prefix client audit --audit-level=critical || true
