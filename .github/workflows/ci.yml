name: IntelliHire CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  client-check:
    name: Client Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Run ESLint
        run: npm --prefix client run lint

      - name: Run TypeScript Check
        run: npm --prefix client run check

      - name: Run Client Vitest Unit Tests
        run: npm --prefix client test

  backend-pytest:
    name: FastAPI Backend Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov bcrypt pyjwt fastapi pydantic uvicorn slowapi psycopg pydantic-settings

      - name: Run Pytest Suite
        run: pytest server_py/tests
