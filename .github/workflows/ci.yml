name: IntelliHire CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  client-check:
    name: Client Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Run ESLint
        run: npm --prefix client run lint

      - name: Run TypeScript Check
        run: npm --prefix client run check

      - name: Run Client Vitest Unit Tests (with coverage thresholds)
        run: npm --prefix client run test -- --run --coverage

  backend-pytest:
    name: FastAPI Backend Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellihire
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: "ci-secret-key-for-testing-purposes-only-1234567890"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/intellihire"
      NODE_ENV: "test"
      PYTHONPATH: "server_py"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server_py/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_py/requirements.txt
          pip install pytest-cov bandit

      - name: Apply Database Schemas
        env:
          PGPASSWORD: postgres
        run: |
          for sql in database/*.sql; do
            psql -h 127.0.0.1 -U postgres -d intellihire -f "$sql"
          done

      - name: Run Pytest Suite with Coverage
        run: python -m pytest server_py/tests --cov=server_py/app --cov-report=term-missing --cov-fail-under=70

      - name: Scan Python source with Bandit (fail on HIGH/CRITICAL)
        run: bandit -q -r server_py/app -s B101,B104,B105 -ll

      - name: Audit installed Python packages with pip-audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  dependency-audit:
    name: Dependency & Secret & Container Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Audit client dependencies (fail on critical)
        run: npm --prefix client audit --audit-level=critical

      - name: Dependency review (PRs only, fail on high)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Container / config / secret scan with Trivy (fail on HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,misconfig,secret

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.json
          scanners: vuln
          exit-code: '0'

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

  e2e-playwright:
    name: Playwright E2E (smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellihire
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: "ci-secret-key-for-testing-purposes-only-1234567890"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/intellihire"
      NODE_ENV: "test"
      PYTHONPATH: "server_py"
      PYTHON: "python3"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server_py/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_py/requirements.txt

      - name: Apply Database Schemas
        env:
          PGPASSWORD: postgres
        run: |
          for sql in database/*.sql; do
            psql -h 127.0.0.1 -U postgres -d intellihire -f "$sql"
          done

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Verify generated API types match the FastAPI schema (contract drift gate)
        run: |
          npm run gen:api-types
          git diff --exit-code client/src/lib/api-types.gen.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
