name: IntelliHire CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  client-check:
    name: Client Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm --prefix client install

      - name: Run ESLint
        run: npm --prefix client run lint

      - name: Run TypeScript Check
        run: npm --prefix client run check

      - name: Run Client Vitest Unit Tests
        run: npm --prefix client run test -- --run

  backend-pytest:
    name: FastAPI Backend Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellihire
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: "ci-secret-key-for-testing-purposes-only-1234567890"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intellihire"
      NODE_ENV: "test"
      PYTHONPATH: "server_py"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server_py/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_py/requirements.txt
          pip install pytest-cov bandit

      - name: Apply Database Schemas
        env:
          PGPASSWORD: postgres
        run: |
          for sql in database/*.sql; do
            psql -h localhost -U postgres -d intellihire -f "$sql"
          done

      - name: Run Pytest Suite with Coverage
        run: python -m pytest server_py/tests --cov=server_py/app --cov-report=term-missing --cov-fail-under=30

      - name: Scan Python source with Bandit (fail on HIGH/CRITICAL)
        run: bandit -q -r server_py/app -s B101,B104,B105 -ll

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm --prefix client install

      - name: Audit client dependencies (fail on critical)
        run: npm --prefix client audit --audit-level=critical

  e2e-playwright:
    name: Playwright E2E (smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellihire
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: "ci-secret-key-for-testing-purposes-only-1234567890"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/intellihire"
      NODE_ENV: "test"
      PYTHONPATH: "server_py"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server_py/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_py/requirements.txt

      - name: Apply Database Schemas
        env:
          PGPASSWORD: postgres
        run: |
          for sql in database/*.sql; do
            psql -h localhost -U postgres -d intellihire -f "$sql"
          done

      - name: Install Root Dependencies
        run: npm install

      - name: Install Client Dependencies
        run: npm --prefix client install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Pre-flight server check
        run: |
          echo "=== Starting backend server ==="
          npm run server:py &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"

          echo "=== Waiting for backend health ==="
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:5000/api/health && echo "Backend OK" || echo "Backend FAILED"

          echo "=== Testing login endpoint ==="
          curl -sf -X POST http://127.0.0.1:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@intellihire.com","password":"admin123"}' \
            -w "\nHTTP Status: %{http_code}\n" || echo "Login request failed"

          echo "=== Stopping pre-flight backend ==="
          kill $BACKEND_PID 2>/dev/null || true
          sleep 2

      - name: Run Playwright smoke suite
        run: npx playwright test e2e/login.spec.ts e2e/hub-smoke.spec.ts e2e/api.spec.ts --reporter=list,html

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
