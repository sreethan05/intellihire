name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Type Check (Client)
        run: npm --prefix client run check

      - name: Type Check (Server)
        run: npm --prefix server run check

      - name: Lint (Client)
        run: npm --prefix client run lint

      - name: Lint (Server)
        run: npm --prefix server run lint

  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret-must-be-32-chars-long-for-ci-only
      GROQ_API_KEY: test-groq-key
      GROQ_MODEL: llama-3.3-70b-versatile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run Server Tests
        run: npm --prefix server run test

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Build Client
        run: npm --prefix client run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: server/dist/

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: intellihire_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: test-jwt-secret-must-be-32-chars-long-for-ci-only
      GROQ_API_KEY: test-groq-key
      GROQ_MODEL: llama-3.3-70b-versatile
      DATABASE_URL: postgres://postgres:password@127.0.0.1:5433/intellihire_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Database Migrations
        run: npm --prefix server run migrate

      - name: Seed E2E Users
        run: npx tsx server/src/seed_e2e_users.ts

      - name: Run E2E Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: intellihire:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
