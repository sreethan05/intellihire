services:
  - type: web
    name: intellihire
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHONPATH
        value: server_py
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: DATA_RETENTION_INTERVAL_HOURS
        value: 24
      - key: GROQ_API_KEY
        sync: false
